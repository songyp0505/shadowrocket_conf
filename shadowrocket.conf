[URL Rewrite]
# 合并 g.cn 与 google.cn 的 HTTP/HTTPS 跳转
^https?://(www\.)?(g|google)\.cn https://www.google.com 302

[MITM]
# 证书与私钥由每台设备的本地证书模块提供，不写入 GitHub 共享配置
enable = true
hostname = g.cn,www.g.cn,google.cn,www.google.cn
