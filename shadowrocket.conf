# 通用代理优先于通用国内集合，保留重叠域名的代理需求（如 google.cn）
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Proxy/Proxy.list,🚀 默认代理
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Proxy/Proxy_Domain.list,🚀 默认代理

# China 两个文件互补，必须配套引用；不要再叠加 ChinaMax 或其他通用国内大集合
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China.list,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China_Domain.list,DIRECT

# 未命中国内域名规则时，再按国内 IP 兜底
GEOIP,CN,DIRECT
FINAL,🚀 默认代理

[URL Rewrite]
# 仅匹配 g.cn / google.cn 的完整主机名，避免误匹配 google.cn.example.com 等域名
^https?://(?:www\.)?(?:g|google)\.cn(?::[0-9]+)?(?=[/?#]|$) https://www.google.com 302

[MITM]
# 证书与私钥由每台设备的本地证书模块提供，不写入 GitHub 共享配置
enable = true
hostname = g.cn,www.g.cn,google.cn,www.google.cn
