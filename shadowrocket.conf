# Shadowrocket clean configuration
# Created: 2026-09-02
# Status: release candidate; device verification pending
#
# This file is rebuilt from zero.
# Existing Mac and iPhone configurations are read-only references.

[General]
# 直连域名优先使用国内加密 DNS；禁用 HTTP/3 以提高复杂网络下的兼容性
dns-server = https://dns.alidns.com/dns-query#no-h3,https://doh.pub/dns-query#no-h3

# 主 DNS 失败或超时后，使用公共 DNS 与系统 DNS 作为可用性兜底
fallback-dns-server = 223.5.5.5,119.29.29.29,system
dns-direct-system = false
dns-direct-fallback-proxy = false
update-url = https://raw.githubusercontent.com/songyp0505/shadowrocket_conf/main/shadowrocket.conf

# OpenCodex 会拒绝 Shadowrocket 的 198.18.0.0/15 Fake IP；该接口必须返回真实 IP
always-real-ip = daily-cloudcode-pa.googleapis.com

# 局域网、本机、链路本地及组播地址不进入 Shadowrocket TUN
tun-excluded-routes = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,239.255.255.250/32,255.255.255.255/32,::1/128,fc00::/7,fe80::/10,ff00::/8

# 启用 IPv6，但仍优先使用 IPv4
ipv6 = true
prefer-ipv6 = false

# 接受 NAS、路由器等局域网服务返回的私有 IP
private-ip-answer = true
icmp-auto-reply = true

[Proxy Group]
# 日常代理入口：节点由用户在 Shadowrocket 中手动选择
🚀 默认代理 = select,PROXY,DIRECT,use=true,policy-select-name=PROXY

# EMBY 可独立选择专用节点、默认代理或直连
EMBY = select,EMBY节点,🚀 默认代理,DIRECT,policy-select-name=EMBY节点

# 从 Shadowrocket 现有节点中筛选新加坡、台湾节点并自动故障转移
EMBY节点 = fallback,use=true,interval=600,timeout=5,url=http://www.gstatic.com/generate_204,policy-regex-filter=(?i)(?:新加坡|狮城|singapore|sg|台湾|台灣|taiwan|tw)

# Spotify 默认直连，也可手动切换到默认代理
🎻 SPOTIFY = select,DIRECT,🚀 默认代理,policy-select-name=DIRECT

# Apple 基础服务默认直连；Apple 海外/代理服务默认使用代理
🍎 Apple基础服务 = select,DIRECT,🚀 默认代理,policy-select-name=DIRECT
🌐 Apple代理服务 = select,🚀 默认代理,DIRECT,policy-select-name=🚀 默认代理

